# electron-builder の設定。
# `yarn dist` / `yarn dist:win` などから参照される（package.json の scripts を参照）。
# 前段の `yarn build`（tsc -b && vite build）が dist/ と dist-electron/ を生成済みである前提。
appId: com.taichioikawa.dmxconsole
productName: DMX Console
copyright: Copyright © 2026 TaichiOikawa

# パッケージへ同梱するファイル。
#  - dist/          : renderer（Vite ビルド成果物。main.js が ../dist/index.html を読み込む）
#  - dist-electron/ : main プロセス & preload（main.js, preload.cjs）
#  - package.json   : main フィールド（dist-electron/main.js）解決に必要
#
# renderer/main の依存は基本すべて Vite/Rolldown でバンドル済み。唯一の例外が
# serialport（OpenDMX 出力）で、ネイティブモジュール（.node）はバンドルできないため
# 実体を同梱する必要がある。
#
# そこで「同梱が必要なものだけ dependencies、バンドル済みのものは devDependencies」と
# package.json 側で切り分けてある。electron-builder は devDependencies を自動で
# 除外するので、node_modules からは serialport とその依存だけが入る。
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# serialport の prebuild は N-API（ABI 非依存）なので、Electron 向けの再ビルドは不要。
npmRebuild: false
asar: true
# ネイティブモジュールは asar 内から dlopen できないため展開して配置する。
asarUnpack:
  - "**/*.node"
  - "node_modules/@serialport/bindings-cpp/**"

directories:
  output: release
  buildResources: build

# 自動更新の配信元（electron-updater が参照する app-update.yml はここから生成される）。
# GitHub Actions の release ワークフローが `--publish always` でここへアップロードする。
publish:
  provider: github
  owner: TaichiOikawa
  repo: DMX-Controller

# Windows: NSIS インストーラ + ポータブル exe（インストール不要で実行可能）。
# 自動更新が効くのは NSIS 版のみ。ポータブル版は更新チェックをスキップする
# （src/main/updater.ts の isPortable を参照）。
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # build/icon.ico があれば使用される。無い場合は Electron 既定アイコンになる。
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DMX Console

# macOS（ビルドする場合）。
mac:
  target:
    - dmg
  category: public.app-category.music
  icon: build/icon.icns

# Linux（ビルドする場合）。
linux:
  target:
    - AppImage
  category: AudioVideo
  icon: build/icon.png
